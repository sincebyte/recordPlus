name: RecordPlusPlus
options:
  bundleIdPrefix: com.recordplusplus
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  RecordPlusPlus:
    type: application
    platform: macOS
    sources:
      - path: Sources/RecordPlusPlus
      - path: Resources/Assets.xcassets
      - path: Resources/AppIcon.icns
        type: resource
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.recordplusplus.app
        PRODUCT_NAME: "Record++"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/RecordPlusPlus.entitlements
    preBuildScripts:
      - name: "Generate App Icon"
        script: |
          python3 "${PROJECT_DIR}/Resources/generate_icon.py"